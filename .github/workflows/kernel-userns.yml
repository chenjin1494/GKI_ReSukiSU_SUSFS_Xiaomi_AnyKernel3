name: Android 13 5.15.194 USER_NS build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/kernel-userns.yml

jobs:
  build-userns:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-userns]') }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android13
      kernel_version: "5.15"
      sub_level: "194"
      os_patch_level: "2025-12"
      revision: "r1"
      ksu_variant: ReSukiSU
      version: "5.15.194-android13-8-00019-gf4321180a397-ab15212794"
      build_time: "Wed Apr 15 01:39:41 UTC 2026"
      boot_os_patch_level: "2026-08-01"
      use_zram: true
      use_bbg: true
      use_net_enhance: true
      use_kpm: "disabled (关闭)"
      use_rekernel: true
      cve_2026_43499_patch: true
      enable_susfs: true
      supp_op: false
      droidspaces: "678"
      artifact_upload_mode: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync: true
      skip_incompatible: false
